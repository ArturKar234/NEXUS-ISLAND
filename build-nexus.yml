name: Build NEXUS ISLAND
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '**.cs'
      - '**.xaml'
      - '**.csproj'
      - '.github/workflows/build-nexus.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained application
        run: dotnet publish NexusIsland.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-ISLAND-1.0-win-x64
          path: publish/NEXUS_ISLAND.exe
          if-no-files-found: error
