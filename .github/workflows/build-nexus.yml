
name: Build NEXUS ISLAND - Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build EXE
        shell: pwsh
        run: |
          dotnet publish ./NexusIsland.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o ./publish

      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS_ISLAND-Windows-x64
          path: publish/NEXUS_ISLAND.exe
          if-no-files-found: error
